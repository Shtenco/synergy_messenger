name: SYNERGY Runner Probe

on:
  push:
    branches:
      - import/alpha9-direct-final

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe hosted runner without external actions
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "node=$(node -v || true)"
          echo "java=$(java -version 2>&1 | head -n 1 || true)"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -n "${GITHUB_WORKSPACE:-}"
